<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Equuleus · Gestión de fincas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5F1; --panel:#FFFFFF; --ink:#182219; --muted:#5F6E63; --faint:#93A096;
  --line:#E1E7DC; --line2:#EDF1E9;
  --sidebar:#1D2A22; --sidebar-ink:#C9D6CC; --sidebar-active:#2E4436;
  --leaf:#2F5233; --leaf-600:#274A31; --leaf-soft:#E5EEE2;
  --accent:#C7622A;               /* naranja tostado para acciones primarias */
  --limon:#E4BE2E; --mandarina:#F0952E; --naranja:#D8641B;
  --tag-fum:#3E6C8E; --tag-abo:#3F7A46; --tag-her:#B08018; --tag-bio:#2E8B84; --tag-nut:#7A5AA6; --tag-otr:#7C8A80;
  --shadow:0 1px 2px rgba(24,34,25,.05),0 10px 30px rgba(24,34,25,.05);
  --r:12px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}
.mono,.num{font-variant-numeric:tabular-nums}
h1,h2,h3,.kpi-v,.brand-t{font-family:'Space Grotesk','Inter',sans-serif}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.side{background:var(--sidebar);color:var(--sidebar-ink);padding:20px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:11px;padding:6px 8px 18px}
.brand svg{flex:0 0 auto}
.brand-t{color:#fff;font-weight:700;font-size:19px;letter-spacing:.02em}
.brand-s{color:#8FA595;font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px;margin-top:4px}
.nav button{display:flex;align-items:center;gap:11px;background:transparent;border:0;color:var(--sidebar-ink);
  font-family:inherit;font-size:15px;font-weight:500;padding:11px 12px;border-radius:10px;cursor:pointer;text-align:left;transition:.12s}
.nav button:hover{background:#26382D;color:#fff}
.nav button.on{background:var(--sidebar-active);color:#fff;font-weight:600}
.nav .ic{width:18px;height:18px;opacity:.9}
.side .foot{margin-top:auto;font-size:11px;color:#6E8375;padding:8px;line-height:1.5}

.main{padding:26px 34px 70px;max-width:1180px}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:20px;flex-wrap:wrap}
.page-head h1{font-size:26px;margin:0 0 3px;letter-spacing:-.01em}
.page-head p{margin:0;color:var(--muted);font-size:14px}
.tag-demo{font-size:11px;color:var(--faint);border:1px solid var(--line);padding:3px 8px;border-radius:20px;background:#fff}

/* ---------- filters ---------- */
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.chipset{display:inline-flex;gap:4px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:4px}
.chipset button{border:0;background:transparent;color:var(--muted);font-family:inherit;font-weight:600;font-size:13.5px;padding:7px 13px;border-radius:7px;cursor:pointer}
.chipset button.on{background:var(--leaf);color:#fff}
.search{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:0 12px;height:38px}
.search input{border:0;outline:0;font-family:inherit;font-size:14px;width:170px;background:transparent;color:var(--ink)}
select.sel{height:38px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:0 12px;font-family:inherit;font-size:14px;color:var(--ink)}

/* ---------- kpis ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow)}
.kpi .l{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.kpi .kpi-v{font-size:27px;font-weight:700;margin-top:6px;letter-spacing:-.01em}
.kpi .d{font-size:12.5px;color:var(--faint);margin-top:2px}

/* ---------- cards / tables ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.card-h{display:flex;justify-content:space-between;align-items:baseline;padding:18px 20px 4px}
.card-h h2{font-size:18px;margin:0}
.card-h .rt{font-size:13px;color:var(--muted)}
table{width:100%;border-collapse:collapse}
thead th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;text-align:right;padding:14px 20px 10px;cursor:pointer;user-select:none;white-space:nowrap}
thead th.l{text-align:left}
thead th:hover{color:var(--ink)}
thead th .ar{opacity:.4;font-size:10px;margin-left:3px}
thead th.sorted .ar{opacity:1}
tbody td{padding:13px 20px;border-top:1px solid var(--line2);text-align:right;font-size:15px}
tbody td.l{text-align:left}
tbody tr:hover{background:#FAFBF8}
.var{display:flex;align-items:center;gap:11px}
.chip{width:15px;height:15px;border-radius:50%;flex:0 0 auto;box-shadow:inset 0 0 0 2px rgba(0,0,0,.05)}
.vn{font-weight:600}.vsp{font-size:12px;color:var(--muted)}
.big{font-weight:700;font-family:'Space Grotesk',sans-serif}
.bar{height:10px;border-radius:5px;background:var(--leaf-soft);width:150px;overflow:hidden}
.bar>span{display:block;height:100%;border-radius:5px}
.totalrow td{border-top:2px solid var(--ink);font-weight:700;background:#F4F7F1}
.tagcat{display:inline-block;font-size:12px;font-weight:600;color:#fff;padding:3px 9px;border-radius:20px;white-space:nowrap}
.aprox{color:var(--faint);font-size:12px}

.pending{margin:16px 0 0;display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--muted);
  background:#F4F7F1;border:1px dashed var(--line);border-radius:12px;padding:12px 14px}
.pending b{color:var(--ink)}
.note{font-size:12px;color:var(--faint);margin-top:16px;line-height:1.6}

/* ---------- forms ---------- */
.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px 20px;padding:20px}
@media(max-width:760px){.formgrid{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field select{height:42px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font-family:inherit;font-size:15px;background:#fff;color:var(--ink)}
.field input:focus,.field select:focus{outline:2px solid var(--leaf-soft);border-color:var(--leaf)}
.field.full{grid-column:1/-1}
.calc{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;background:var(--leaf-soft);border-radius:10px;padding:14px 18px;font-size:15px}
.calc b{font-family:'Space Grotesk';font-size:22px}
.formbar{display:flex;justify-content:flex-end;gap:10px;padding:0 20px 20px}
.btn{border:0;font-family:inherit;font-weight:600;font-size:15px;padding:11px 20px;border-radius:10px;cursor:pointer}
.btn.primary{background:var(--accent);color:#fff}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(30px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:12px;opacity:0;transition:.25s;font-size:14px;font-weight:500;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- fincas cards ---------- */
.fgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
@media(max-width:760px){.fgrid{grid-template-columns:1fr}}
.fcard{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow)}
.fcard h3{margin:0 0 2px;font-size:19px}
.fcard .fm{color:var(--muted);font-size:13px;margin-bottom:14px}
.fcard .vlist{display:flex;flex-wrap:wrap;gap:7px}
.vpill{display:inline-flex;align-items:center;gap:7px;background:#F5F8F2;border:1px solid var(--line);border-radius:20px;padding:5px 11px;font-size:13px}
.vpill .chip{width:11px;height:11px}
.fcard .fstats{display:flex;gap:22px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line2)}
.fstat .n{font-family:'Space Grotesk';font-weight:700;font-size:20px}
.fstat .t{font-size:12px;color:var(--muted)}

.hide{display:none}
.mobtoggle{display:none}
@media(max-width:720px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;z-index:40;width:236px;transform:translateX(-100%);transition:.2s}
  .side.open{transform:none}
  .mobtoggle{display:inline-flex;position:fixed;top:14px;left:14px;z-index:50;background:var(--sidebar);color:#fff;border:0;border-radius:10px;padding:10px 12px;cursor:pointer}
  .main{padding-top:64px}
}
</style>
</head>

/* cada variedad recibe su gasto estimado: total real de la finca repartido por peso ha×intensidad */
function varGasto(f,v){const sw=f.vars.reduce((s,x)=>s+x.ha*x.w,0);return f.totalReal*(v.ha*v.w)/sw;}

/* ============ RENDER ROUTER ============ */
function go(p){page=p;[...document.querySelectorAll('#nav button')].forEach(b=>b.classList.toggle('on',b.dataset.p===p));

document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('button');if(b)go(b.dataset.p);});

function render(){({panel:renderPanel,productos:renderProductos,gastos:renderGastos,ventas:renderVentas,fincas:renderFincas}[page])();}

/* ---------- PANEL ---------- */
function panelRows(){
  let rows=[];
  FINCAS.filter(f=>pFinca==="todas"||f.id===pFinca).forEach(f=>{
    f.vars.forEach(v=>rows.push({finca:f.nombre,n:v.n,sp:v.sp,ha:v.ha,arb:v.arb,gasto:varGasto(f,v),aprox:v.aprox||f.aprox}));
  });
  // si "todas las fincas": agregamos variedades iguales
  if(pFinca==="todas"){
    const m={};rows.forEach(r=>{const k=r.n;if(!m[k])m[k]={n:r.n,sp:r.sp,ha:0,arb:0,gasto:0,aprox:false,finca:"varias"};
      m[k].ha+=r.ha;m[k].arb+=r.arb;m[k].gasto+=r.gasto;m[k].aprox=m[k].aprox||r.aprox;});
    rows=Object.values(m);
  }
  if(pSpecies!=="todas")rows=rows.filter(r=>r.sp===pSpecies);
  if(pQuery)rows=rows.filter(r=>r.n.toLowerCase().includes(pQuery.toLowerCase()));
  rows.forEach(r=>{r.eurha=r.gasto/r.ha;r.eurarb=r.gasto/r.arb;});
  rows.sort((a,b)=>(a[pSort.k]<b[pSort.k]?-1:1)*pSort.dir);
  return rows;
}
function th(k,label,cls,st){const cur=st.k===k;return `<th class="${cls||''} ${cur?'sorted':''}" data-k="${k}">${label}<span class="ar">${cur?(st.dir<0?'▼':'▲'):'▲'}</span></th>`;}

function renderPanel(){
  const rows=panelRows();

  const maxg=Math.max(...rows.map(r=>r.gasto),1);
  const fincaName=pFinca==="todas"?"todas las fincas":FINCAS.find(f=>f.id===pFinca).nombre;
  document.getElementById('main').innerHTML=`

    <div class="kpi"><div class="l">Gasto medio / ha</div><div class="kpi-v">${eur(total/tha)}</div><div class="d">${ha2(tha)} ha</div></div>
    <div class="kpi"><div class="l">Variedades</div><div class="kpi-v">${rows.length}</div><div class="d">en vista</div></div>
    <div class="kpi"><div class="l">Árboles</div><div class="kpi-v">${int(tarb)}</div><div class="d">${eur(total/tarb)} / árbol</div></div>

        <td class="num">${ha2(r.ha)}</td>

      </tbody>

        <td class="l">Total</td><td class="num">${ha2(tha)}</td><td class="num">${int(tarb)}</td>

  // listeners
  document.getElementById('fFinca').onchange=e=>{pFinca=e.target.value;render();};
  document.getElementById('fSp').onclick=e=>{const b=e.target.closest('button');if(b){pSpecies=b.dataset.s;render();}};
  document.getElementById('fQ').oninput=e=>{pQuery=e.target.value;const rows=panelRows();/* light refresh */ render();document.getElementById('fQ').focus();};
  document.querySelectorAll('thead th[data-k]').forEach(th=>th.onclick=()=>{const k=th.dataset.k;pSort.dir=(pSort.k===k)?-pSort.dir:-1;pSort.k=k;render();});
}

  let rows=PRODUCTS.slice();
  if(prodExpl!=="todas")rows=rows.filter(r=>r.expl===prodExpl);
  if(prodCat!=="todas")rows=rows.filter(r=>r.cat===prodCat);
  if(prodQuery)rows=rows.filter(r=>r.prod.toLowerCase().includes(prodQuery.toLowerCase()));
  rows.sort((a,b)=>(a[prodSort.k]<b[prodSort.k]?-1:1)*prodSort.dir);
  return rows;
}
function renderProductos(){
  const rows=prodRows();
  const total=rows.reduce((s,r)=>s+r.imp,0);
  const cats=[...new Set(PRODUCTS.map(r=>r.cat))];
  const expls=[...new Set(PRODUCTS.map(r=>r.expl))];
  // desglose por categoria (para barras)
  const byCat={};rows.forEach(r=>byCat[r.cat]=(byCat[r.cat]||0)+r.imp);
  const catArr=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  const maxc=Math.max(...catArr.map(c=>c[1]),1);
  const topCat=catArr[0]?catArr[0][0]:'—';
  document.getElementById('main').innerHTML=`
  <div class="page-head">
    <div><h1>Productos utilizados</h1><p>Gasto acumulado en productos · control de compras 2026</p></div>
    <span class="tag-demo">Datos reales (Excel de compras)</span>
  </div>
  <div class="filters">
    <select class="sel" id="pExpl"><option value="todas">Todas las explotaciones</option>
      ${expls.map(x=>`<option value="${x}" ${prodExpl===x?'selected':''}>${x}</option>`).join('')}</select>
    <select class="sel" id="pCat"><option value="todas">Todas las categorías</option>
      ${cats.map(c=>`<option value="${c}" ${prodCat===c?'selected':''}>${c}</option>`).join('')}</select>
    <div class="search">🔎<input id="pQ" placeholder="Buscar producto…" value="${prodQuery}"></div>
  </div>
  <div class="kpis">
    <div class="kpi"><div class="l">Gasto en productos</div><div class="kpi-v">${eur(total)}</div><div class="d">${prodExpl==='todas'?'todas las explotaciones':prodExpl}</div></div>
    <div class="kpi"><div class="l">Productos distintos</div><div class="kpi-v">${rows.length}</div><div class="d">en vista</div></div>
    <div class="kpi"><div class="l">Categoría mayor</div><div class="kpi-v" style="font-size:20px">${topCat}</div><div class="d">${catArr[0]?eur(catArr[0][1]):''}</div></div>
    <div class="kpi"><div class="l">Categorías</div><div class="kpi-v">${catArr.length}</div><div class="d">con gasto</div></div>
  </div>
  <div class="card" style="margin-bottom:22px"><div class="card-h"><h2>Gasto por categoría</h2></div>
    <div style="padding:6px 20px 18px;display:flex;flex-direction:column;gap:10px">
      ${catArr.map(([c,v])=>`<div style="display:flex;align-items:center;gap:12px">
        <span class="tagcat" style="background:${CAT_COLOR[c]||'var(--tag-otr)'};min-width:118px;text-align:center">${c}</span>
        <div class="bar" style="flex:1;width:auto;height:14px"><span style="width:${Math.round(v/maxc*100)}%;background:${CAT_COLOR[c]||'var(--tag-otr)'}"></span></div>
        <span class="num big" style="min-width:90px;text-align:right;font-size:15px">${eur(v)}</span></div>`).join('')}
    </div>
  </div>
  <div class="card">
    <div class="card-h"><h2>Detalle de productos</h2><span class="rt">${rows.length} productos</span></div>
    <table>
      <thead><tr>
        ${th('prod','Producto','l',prodSort)}
        ${th('cat','Categoría','l',prodSort)}
        ${th('expl','Explotación','l',prodSort)}
        ${th('imp','Gasto',null,prodSort)}
      </tr></thead>
      <tbody>
      ${rows.slice(0,120).map(r=>`<tr>
        <td class="l"><span class="vn">${r.prod}</span></td>
        <td class="l"><span class="tagcat" style="background:${CAT_COLOR[r.cat]||'var(--tag-otr)'}">${r.cat}</span></td>
        <td class="l">${r.expl}</td>
        <td class="num big">${eur(r.imp)}</td></tr>`).join('')}
      </tbody>
      <tfoot><tr class="totalrow"><td class="l">Total</td><td></td><td></td><td class="num">${eur(total)}</td></tr></tfoot>
    </table>
  </div>
  <div class="note">Importes reales de las facturas de compra de 2026. Ligar cada producto a la variedad donde se aplica es lo que hará la captura diaria: entonces este gasto pasará automáticamente al panel por variedad.</div>`;
  document.getElementById('pExpl').onchange=e=>{prodExpl=e.target.value;render();};
  document.getElementById('pCat').onchange=e=>{prodCat=e.target.value;render();};
  document.getElementById('pQ').oninput=e=>{prodQuery=e.target.value;render();document.getElementById('pQ').focus();};
  document.querySelectorAll('thead th[data-k]').forEach(th=>th.onclick=()=>{const k=th.dataset.k;prodSort.dir=(prodSort.k===k)?-prodSort.dir:-1;prodSort.k=k;render();});
}

/* ---------- REGISTRAR GASTO ---------- */
function renderGastos(){
  const prodNames=[...new Set(PRODUCTS.map(p=>p.prod))].sort();
  document.getElementById('main').innerHTML=`
  <div class="page-head"><div><h1>Registrar gasto</h1><p>Anotar un producto aplicado a una variedad — así se alimenta el panel</p></div>
    <span class="tag-demo">Maqueta de captura</span></div>
  <div class="card"><div class="card-h"><h2>Nuevo apunte de gasto</h2></div>
    <div class="formgrid">
      <div class="field"><label>Fecha</label><input type="date" id="gFecha"></div>
      <div class="field"><label>Finca</label><select id="gFinca">${FINCAS.map(f=>`<option value="${f.id}">${f.nombre}</option>`).join('')}</select></div>
      <div class="field"><label>Variedad</label><select id="gVar"></select></div>
      <div class="field"><label>Producto</label><select id="gProd"><option value="">—</option>${prodNames.map(p=>`<option>${p}</option>`).join('')}</select></div>
      <div class="field"><label>Cantidad</label><input type="number" id="gCant" placeholder="0"></div>
      <div class="field"><label>Precio unitario (€)</label><input type="number" id="gPrecio" step="0.01" placeholder="0,00"></div>
      <div class="field full"><label>Observaciones (opcional)</label><input id="gObs" placeholder="Tratamiento, tajo, incidencia…"></div>
      <div class="calc"><span>Importe calculado</span><b id="gImp">0 €</b></div>
    </div>
    <div class="formbar"><button class="btn ghost" onclick="render()">Limpiar</button><button class="btn primary" id="gSave">Guardar apunte</button></div>
  </div>
  <div class="note">En la práctica, el precio unitario se autocompleta desde el catálogo de productos y el operario solo elige producto, cantidad y variedad. Este formulario es la versión de oficina; la de campo (móvil/papel) la lleva el otro compañero.</div>`;
  const fSel=document.getElementById('gFinca'),vSel=document.getElementById('gVar');
  const fillVars=()=>{const f=FINCAS.find(x=>x.id===fSel.value);vSel.innerHTML=f.vars.map(v=>`<option>${v.n}</option>`).join('');};
  fillVars();fSel.onchange=fillVars;
  const calc=()=>{const q=parseFloat(document.getElementById('gCant').value)||0,p=parseFloat(document.getElementById('gPrecio').value)||0;document.getElementById('gImp').textContent=eur(q*p);};
  document.getElementById('gCant').oninput=calc;document.getElementById('gPrecio').oninput=calc;
  document.getElementById('gSave').onclick=()=>toast("Apunte guardado (demo — sin base de datos aún)");
}

/* ---------- REGISTRAR VENTA ---------- */
function renderVentas(){
  document.getElementById('main').innerHTML=`
  <div class="page-head"><div><h1>Registrar venta</h1><p>Kg y precio por variedad — lo que falta para calcular €/kg y margen</p></div>
    <span class="tag-demo">Maqueta de captura</span></div>
  <div class="card"><div class="card-h"><h2>Nueva venta</h2></div>
    <div class="formgrid">
      <div class="field"><label>Campaña</label><select id="vCamp"><option>2025/2026</option><option>2024/2025</option></select></div>
      <div class="field"><label>Finca</label><select id="vFinca">${FINCAS.map(f=>`<option value="${f.id}">${f.nombre}</option>`).join('')}</select></div>
      <div class="field"><label>Variedad</label><select id="vVar"></select></div>
      <div class="field"><label>Fecha</label><input type="date" id="vFecha"></div>
      <div class="field"><label>Kilos vendidos</label><input type="number" id="vKg" placeholder="0"></div>
      <div class="field"><label>Precio (€/kg)</label><input type="number" id="vPrecio" step="0.001" placeholder="0,000"></div>
      <div class="calc"><span>Ingreso calculado</span><b id="vImp">0 €</b></div>

    <div class="formbar"><button class="btn ghost" onclick="render()">Limpiar</button><button class="btn primary" id="vSave">Guardar venta</button></div>
  </div>
  <div class="note">Con las ventas por variedad, el panel podrá mostrar €/kg y el margen frente al coste — que es lo que de verdad responde "¿en qué variedad invierto?".</div>`;
  const fSel=document.getElementById('vFinca'),vSel=document.getElementById('vVar');
  const fillVars=()=>{const f=FINCAS.find(x=>x.id===fSel.value);vSel.innerHTML=f.vars.map(v=>`<option>${v.n}</option>`).join('');};
  fillVars();fSel.onchange=fillVars;
  const calc=()=>{const q=parseFloat(document.getElementById('vKg').value)||0,p=parseFloat(document.getElementById('vPrecio').value)||0;document.getElementById('vImp').textContent=eur(q*p);};
  document.getElementById('vKg').oninput=calc;document.getElementById('vPrecio').oninput=calc;

}

/* ---------- FINCAS ---------- */
function renderFincas(){
  document.getElementById('main').innerHTML=`
  <div class="page-head"><div><h1>Fincas</h1><p>Las cuatro explotaciones del grupo</p></div></div>
  <div class="fgrid">
    ${FINCAS.map(f=>{const tha=f.vars.reduce((s,v)=>s+v.ha,0),tarb=f.vars.reduce((s,v)=>s+v.arb,0);
      return `<div class="fcard"><h3>${f.nombre}</h3><div class="fm">${f.soc} · ${f.mun}</div>
      <div class="vlist">${f.vars.map(v=>`<span class="vpill"><span class="chip" style="background:${SP_COLOR[v.sp]}"></span>${v.n}</span>`).join('')}</div>
      <div class="fstats">
        <div class="fstat"><div class="n">${ha2(tha)}</div><div class="t">hectáreas</div></div>
        <div class="fstat"><div class="n">${int(tarb)}</div><div class="t">árboles</div></div>
        <div class="fstat"><div class="n">${f.vars.length}</div><div class="t">variedades</div></div>
        <div class="fstat"><div class="n">${eur(f.totalReal)}</div><div class="t">gasto productos 2026</div></div>
      </div></div>`;}).join('')}
  </div>
  <div class="note">Superficie, árboles y variedades reales de los PDF. Gasto en productos real del Excel de compras. ≈ Lo Valenciano y Lo Masera con superficie aproximada.</div>`;
}

/* ---------- toast ---------- */
let tT;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('show'),2200);}

render();
</script>
